<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>BenCreatives — UGC that converts</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@700;900&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --ink:#15140F;
    --paper:#F5F1E6;
    --coral:#FF5A36;
    --stone:#6B664F;
    box-sizing:border-box;
    padding-top:env(safe-area-inset-top,0px);
    padding-bottom:env(safe-area-inset-bottom,0px);
  }
  *,*::before,*::after{box-sizing:inherit;}
  html,body{margin:0;padding:0;}
  body{
    background:var(--paper); color:var(--ink);
    font-family:'Inter',-apple-system,sans-serif;
    line-height:1.5;
  }
  a{color:inherit;}
  .wrap{max-width:720px; margin:0 auto; padding:64px 24px;}
  @media(min-width:700px){.wrap{padding:96px 24px;}}

  header{margin-bottom:56px;}

  .avatar{
    width:120px; height:120px; border-radius:50%; overflow:hidden;
    margin-bottom:22px; box-shadow:0 0 0 4px var(--paper), 0 0 0 5px rgba(21,20,15,0.12);
  }
  .avatar img{width:100%; height:100%; object-fit:cover; display:block;}

  .mark{font-family:'Archivo',sans-serif; font-weight:900; font-size:1.1rem; letter-spacing:-0.01em; margin-bottom:24px;}
  .mark span{color:var(--coral);}
  h1{
    font-family:'Archivo',sans-serif; font-weight:900;
    font-size:clamp(2rem,6vw,3rem); line-height:1.08; letter-spacing:-0.02em;
    margin:0 0 14px; max-width:14ch;
  }
  .tagline{font-size:1.05rem; color:var(--stone); max-width:38ch; margin:0;}

  .stats{
    display:flex; gap:36px; flex-wrap:wrap;
    margin:44px 0 56px; padding:28px 0; border-top:1px solid rgba(21,20,15,0.12); border-bottom:1px solid rgba(21,20,15,0.12);
  }
  .stat b{display:block; font-family:'Archivo',sans-serif; font-weight:900; font-size:2rem; line-height:1;}
  .stat span{font-size:0.85rem; color:var(--stone);}

  .videos h2{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:1.2rem; margin:0 0 18px;
  }


  .bio{
    display:flex; flex-wrap:wrap; gap:8px 14px; margin:18px 0 0; padding:0; list-style:none;
    font-size:0.88rem; color:var(--stone);
  }
  .bio li{white-space:nowrap;}
  .niches{margin:6px 0 0; font-size:0.88rem; color:var(--stone);}
  .niches b{color:var(--ink); font-weight:600;}

  .gallery{margin:56px 0;}
  .gallery h2{
    font-family:'Archivo',sans-serif; font-weight:700; font-size:1.2rem; margin:0 0 18px;
  }
  .gallery-photo{
    width:100%; max-width:360px; border-radius:14px; overflow:hidden;
  }
  .gallery-photo img{width:100%; display:block;}

  footer{max-width:720px; margin:0 auto; padding:0 24px 48px; font-size:0.85rem; color:var(--stone);}

  img{max-width:100%; height:auto;}

  @media(max-width:420px){
    .wrap{padding:44px 18px;}
    .stats{gap:24px; margin:36px 0 44px;}
    .avatar{width:96px; height:96px;}
    .gallery-photo{max-width:100%;}
  }

  @media(min-width:1000px){
    .wrap{max-width:920px; padding:120px 56px 96px;}
    .avatar{width:140px; height:140px;}
    .stats{gap:64px;}
    .stat b{font-size:2.4rem;}
    .gallery-photo{max-width:440px;}
    .videos, .gallery{max-width:640px;}
  }

  @media(min-width:1400px){
    .wrap{max-width:1080px;}
  }
</style>
</head>
